@media (prefers-reduced-motion: no-preference) { .lp-pop { animation: lp-pop .18s var(--ease) both; } }
@keyframes lp-pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }

/* 滚动出现：只在支持且允许动效时；没有脚本、打印、减少动态效果时全部直接可见 */
.lp-motion .lp-reveal { transition: opacity .7s var(--ease), transform .7s var(--ease); }
.lp-motion .lp-reveal:not(.is-in) { opacity: 0; transform: translateY(18px); scroll-margin-top: 42px; }
@media (prefers-reduced-motion: no-preference) { .lp-toggle [data-panel]:not([hidden]) { animation: lp-fade .35s ease both; } }
@keyframes lp-fade { from { opacity: 0; } }

/* 新内容、计时、更新提示 */
.lp-new { display: inline-block; margin-left: .5em; padding: 0 .45em; font-size: 12px; line-height: 1.6; font-weight: 700; letter-spacing: .05em; vertical-align: .2em; color: var(--paper); background: var(--accent); border-radius: 4px; }
:target > h2:first-of-type, :target > h3:first-of-type, h2:target, h3:target { animation: lp-arrive 1.8s ease-out; border-radius: 4px; }
@keyframes lp-arrive { 0%, 30% { background: var(--mark); box-shadow: 0 0 0 6px var(--mark); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
.lp-timer { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; font-size: 14px; color: var(--ink-soft); }
.lp-timer-bar { flex: 1; max-width: 220px; height: 6px; overflow: hidden; background: var(--rule); border-radius: 3px; }
.lp-timer-bar > span { display: block; width: 0; height: 100%; background: var(--ink-soft); }
.lp-timer.is-over .lp-timer-bar > span { background: var(--accent); }
.lp-timer-time { min-width: 3.5em; font-variant-numeric: tabular-nums; }
.lp-banner { position: fixed; left: 50%; bottom: 20px; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; transform: translateX(-50%); font-size: 14.5px; color: var(--band-ink); background: var(--band); border: 1px solid var(--band-rule); border-radius: 999px; box-shadow: var(--shadow); }
.lp-banner .lp-btn.is-primary { color: var(--band); background: var(--band-ink); border-color: var(--band-ink); box-shadow: none; }

/* 符号与名词、来源 */
.lp-glossary dl { display: grid; grid-template-columns: minmax(4em, max-content) 1fr; gap: 8px 18px; font-size: 15.5px; line-height: 1.65; }
.lp-glossary dl > div { display: contents; }
.lp-glossary dt { justify-self: start; align-self: start; padding: 0 .55em; font-family: var(--font-mono); font-size: 14.5px; background: var(--raised); border-radius: 6px; }
.lp-glossary dd { margin: 0; color: var(--ink-soft); }
.lp-sources { margin-top: 80px; padding-top: 20px; font-size: 14px; line-height: 1.7; color: var(--ink-soft); border-top: 1px solid var(--rule); }
.lp-sources h2 { margin: 0 0 8px !important; font-size: 16px !important; color: var(--ink); }
.lp-sources ol { padding-left: 1.4em; overflow-wrap: anywhere; }
.lp-practice { font-size: 15px; color: var(--ink-soft); }
#next-part p { overflow-wrap: anywhere; }
/* 分了页的课：页头的上一页、下一页与分页目录（脚本维护） */
.lp-pager { margin: 18px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--band-soft); }
.lp-pager-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.lp-pager a { color: var(--band-ink); }
.lp-pager-list > summary { width: max-content; cursor: pointer; color: var(--band-ink); }
.lp-pager-list > ol { margin: 10px 0 0; padding: 4px 16px 10px; list-style: none; border: 1px solid var(--band-rule); border-radius: 10px; }
.lp-pager-list > ol > li { margin-top: 8px; }
.lp-pager-list > ol > li[aria-current] > a { font-weight: 600; }
.lp-pager-list ol ol { margin: 2px 0 0; padding: 0; list-style: none; }
.lp-pager-list ol ol a { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); color: var(--band-soft); overflow-wrap: anywhere; }
.lp-pager-list ol ol b { font-variant-numeric: tabular-nums; }
.lp-pager code { color: inherit; background: color-mix(in srgb, var(--band-ink) 14%, transparent); }
.lp-cover :focus-visible { outline-color: var(--band-ink); }

/* 只看要点：结论、骨架、口述版与题目 */
.lp-review-exit { position: fixed; z-index: 45; right: 20px; bottom: 20px; min-height: 40px; padding: 6px 18px; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--band-ink); background: var(--band); border: 1px solid var(--band-rule); border-radius: 999px; box-shadow: var(--shadow); cursor: pointer; }
.lp-review .lp-node > :not(h2):not(.lp-lead):not(.lp-oral):not(.lp-where):not(.lp-spine) { display: none; }
.lp-review .lp-narrative > p:not(:first-of-type), .lp-review #spine, .lp-review .lp-addendum { display: none; }

@media (max-width: 639px) {
  :root { --text: 16.5px; }
  .lp-cover-in { padding-top: 24px; padding-bottom: 28px; }
  .lp-headbar { margin-bottom: 16px; }
  .lp-main h2 { margin-top: 60px; font-size: 21px; }
  .lp-narrative > p:first-of-type, .lp-lead { font-size: 17.5px; }
  .lp-ask { font-size: 17.5px; }
  .lp-check { --pad: 12px; margin-left: -10px; margin-right: -10px; padding-top: 18px; padding-bottom: 8px; }
  .lp-canvas { padding: 14px 12px; }
  :is(.lp-stepper, .lp-explorer, .lp-toggle, .lp-figure.is-stage) { margin-left: -6px; margin-right: -6px; padding: 16px 14px 14px; }
  blockquote.lp-oral { padding: 18px 16px 4px 44px; }
  blockquote.lp-oral::before { left: 10px; }
  pre.lp-code { font-size: 13px; }
}
/* 触屏：所有可点的控件至少 44 像素高；放在全部控件规则之后才压得住它们 */
@media (pointer: coarse) {
  .lp-btn, .lp-seg button, .lp-tools button, .lp-code-copy, .lp-review-exit { min-height: 44px; }
  .lp-toc-inline > summary, details.lp-answer > summary { padding: 10px 0; }
  .lp-dots button { width: 28px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media print {
  :root, :root[data-theme], :is(.lp-stepper, .lp-explorer, .lp-toggle, .lp-figure.is-stage, pre.lp-code, .lp-code-head) {
    color-scheme: light;
    --paper: #ffffff; --raised: #f2f1ec; --ink: #1e2024; --ink-soft: #474a52; --ink-faint: #696c75;
    --rule: #dddbd3; --accent: #b23f27; --accent-ink: #9a321e; --accent-wash: #f7e8e2;
    --mark: #fbe7a8; --s1: #0062a3; --s2: #00765a; --s3: #a0407a; --s4: #8f5b00;
    --code-kw: #6f3fbf; --code-str: #3d7a1f; --code-num: #a8500c; --code-fn: #2453c2; --code-type: #0f736c; --code-com: #63676f; --code-meta: #7d5300;
    --band: #ffffff; --band-ink: #1e2024; --band-soft: #474a52; --band-rule: #dddbd3; --dot: transparent; --glow-a: transparent; --glow-b: transparent; --shadow: none;
  }
  .lp-toc, .lp-toc-inline, .lp-pager-list, .lp-controls, .lp-tools, .lp-updated, .lp-banner, .lp-timer, .lp-new, .lp-progress, .lp-code-copy, .lp-copy-tex, .lp-pop { display: none !important; }
  .lp-motion .lp-reveal { opacity: 1 !important; transform: none !important; }
  .lp-explorer .lp-controls { display: flex !important; }
  .lp-explorer [data-preset] { display: none; }
  .lp-toggle [data-panel][data-label]::before { content: attr(data-label); display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .lp-stepper.is-ready .lp-steps { display: block; }
  .lp-stepper.is-ready .lp-steps > li { display: list-item !important; margin: 0 0 .4em; visibility: visible !important; animation: none !important; }
  .lp-stepper.is-ready [data-show] { opacity: 1 !important; visibility: visible !important; }
  .lp-toggle [data-panel][hidden] { display: block !important; margin-top: 12px; }
  .lp-page, .lp-cover-in { display: block; }
  .lp-note { float: none; width: auto; margin: 0 0 1em !important; }
  blockquote.lp-oral, .lp-check, .lp-figure, pre.lp-code, ol.lp-code-notes, div.tex, .lp-table { break-inside: avoid; }
  h2, h3, .lp-code-head { break-after: avoid; }
  .lp-check { margin-left: 0; margin-right: 0; }
  .lp-review-exit, .lp-cover-in::before { display: none !important; }
  ol.lp-code-notes.is-side { position: static !important; width: auto !important; }
  ol.lp-code-notes.is-side > li { position: relative !important; top: auto !important; }
}
/* ===== 阅读辅助：各段开头有说明 ===== */
:root {
  --line: var(--accent); --line-idle: var(--rule); --station: var(--paper);
  --fog: color-mix(in srgb, var(--paper) 72%, transparent);
  --st1: #d4a94f; --st2: #c06a4a; --st3: #7f9a52; --st4: #4f7fa8; --st5: #9a72b6; --st6: #3f9a8c;
}
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --st1: #e7c271; --st2: #e08a69; --st3: #a7c27a; --st4: #79a9d6; --st5: #c09ad8; --st6: #6cc7b7; }
}
:root[data-theme="dark"] { --st1: #e7c271; --st2: #e08a69; --st3: #a7c27a; --st4: #79a9d6; --st5: #c09ad8; --st6: #6cc7b7; }

/* 地铁线路：讲过的站已通车（实线、实心站），没讲的站在建（虚线、空心站）并蒙着雾 */
.lp-stages.lp-flow { row-gap: 26px; }
.lp-stages.lp-flow > li { padding-top: 32px; }
.lp-stages.lp-flow > li::before { top: 0; width: 22px; height: 22px; background: var(--station); border: 5px solid var(--line-idle); box-shadow: none; }
.lp-stages.lp-flow > li.is-open::before { border-color: var(--line); box-shadow: none; }
.lp-stages.lp-flow > li.is-interchange::before { width: 26px; height: 26px; top: -2px; left: -2px; border: 4px solid var(--ink); box-shadow: inset 0 0 0 3px var(--station), inset 0 0 0 7px var(--line); }
.lp-stages.lp-flow > li:not(:last-child)::after { left: 20px; right: -12px; top: 8px; border-top: 6px solid var(--line); border-radius: 3px; }
.lp-stages.lp-flow > li.to-fog:not(:last-child)::after, .lp-stages.lp-flow > li.is-fog:not(:last-child)::after { border-top-style: dashed; border-top-color: var(--line-idle); }
.lp-stages.lp-flow.is-vertical > li { padding: 0 0 0 36px; }
.lp-stages.lp-flow.is-vertical > li::before { top: .15em; }
.lp-stages.lp-flow.is-vertical > li:not(:last-child)::after { left: 8px; top: calc(.15em + 20px); bottom: -24px; border-top: 0; border-left: 6px solid var(--line); }
.lp-stages.lp-flow.is-vertical > li.to-fog:not(:last-child)::after, .lp-stages.lp-flow.is-vertical > li.is-fog:not(:last-child)::after { border-left-style: dashed; border-left-color: var(--line-idle); }
.lp-xfer { display: block; margin-top: 4px; font-size: 12.5px; color: var(--ink-faint); }
.lp-xfer a { display: inline-block; margin-left: 4px; padding: 0 7px; color: var(--ink-soft); text-decoration: none; background: var(--raised); border-radius: 999px; }
.lp-xfer a:hover { color: var(--ink); }
.lp-soon { display: inline-block; margin-left: .4em; padding: 0 .45em; font-size: 11.5px; font-weight: 600; line-height: 1.6; color: var(--ink-faint); vertical-align: .15em; border: 1px dashed var(--ink-faint); border-radius: 4px; }
/* 迷雾：字还读得出，只是退后；指向或聚焦时拨开 */
.lp-stages > li.is-fog > :not(.lp-mist) { opacity: .55; filter: blur(.8px); transition: opacity .5s ease, filter .5s ease; }
.lp-stages > li.is-fog:hover > :not(.lp-mist), .lp-stages > li.is-fog:focus-within > :not(.lp-mist) { opacity: 1; filter: none; }
.lp-mist { position: absolute; z-index: 2; inset: -14px 0 -10px -14px; pointer-events: none; background: radial-gradient(55% 45% at 22% 30%, var(--fog), transparent 72%), radial-gradient(60% 50% at 70% 62%, var(--fog), transparent 75%), radial-gradient(40% 40% at 45% 85%, var(--fog), transparent 70%); transition: opacity .5s ease; }
.lp-stages > li.is-fog:hover .lp-mist, .lp-stages > li.is-fog:focus-within .lp-mist { opacity: .25; }
.lp-stages > li.is-clearing .lp-mist { animation: lp-clear 1.8s var(--ease) .4s both; }
.lp-stages > li.is-clearing > :not(.lp-mist) { animation: lp-unblur 1.4s var(--ease) .5s both; }
@keyframes lp-clear { from { opacity: 1; filter: none; } to { opacity: 0; filter: blur(8px); } }
@keyframes lp-unblur { from { opacity: .55; filter: blur(.8px); } to { opacity: 1; filter: none; } }

/* 站牌：每个节点开头一块，上一站、本站、下一站，底下是整条线 */
.lp-where.lp-sign { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr); align-items: end; gap: 0 14px; margin: 6px 0 26px; padding: 12px 16px 0; color: var(--band-ink); background: var(--band); border-radius: 10px; overflow: hidden; }
.lp-sign small { display: block; margin-bottom: 1px; font-size: 11.5px; font-weight: 400; letter-spacing: .06em; color: var(--band-soft); }
.lp-sign a, .lp-sign .lp-sign-end { display: block; min-width: 0; padding-bottom: 10px; font-size: 14px; line-height: 1.4; color: var(--band-soft); text-decoration: none; }
.lp-sign a:hover { color: var(--band-ink); }
.lp-sign-prev > span::before { content: "← "; }
.lp-sign-next { text-align: right; }
.lp-sign-next > span::after { content: " →"; }
.lp-sign-next.is-fog > span { opacity: .6; filter: blur(.5px); }
.lp-sign-here { min-width: 0; padding-bottom: 10px; text-align: center; }
.lp-sign-here > span { display: block; font-size: 19px; font-weight: 700; line-height: 1.35; color: var(--band-ink); }
.lp-sign-here > span + span::before { content: "⇄ "; font-weight: 400; color: var(--band-soft); }
.lp-sign-line { grid-column: 1 / -1; position: relative; display: flex; justify-content: space-between; align-items: center; height: 18px; margin: 0 -16px !important; padding: 0 22px !important; list-style: none; background: linear-gradient(var(--line), var(--line)) center / 100% 6px no-repeat; }
.lp-sign-line > li { width: 10px; height: 10px; margin: 0 !important; background: var(--band); border: 2px solid var(--band-ink); border-radius: 50%; }
.lp-sign-line > li.is-fog { background: var(--band); border-style: dashed; border-color: var(--band-soft); }
.lp-sign-line > li.is-here { width: 14px; height: 14px; background: var(--band-ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--band-ink) 30%, transparent); }
@media (max-width: 559px) {
  .lp-where.lp-sign { grid-template-columns: 1fr 1fr; }
  .lp-sign-here { grid-column: 1 / -1; grid-row: 1; padding-bottom: 6px; }
}

/* 中英术语注音：注音只占行距里的空间，不撑高行 */
ruby { ruby-position: over; }
rt { font-family: var(--font-sans); font-size: .5em; font-weight: 400; font-style: normal; line-height: 1; letter-spacing: .02em; color: var(--ink-faint); white-space: nowrap; }

/* 可拖动的数字：可调段落带虚线框和“可调”标签，段里带 ‹ › 的数是小拨盘 */
.lp-live { --pad: 18px; position: relative; margin: 34px calc(-1 * var(--pad)) 26px; padding: 18px var(--pad) 12px; background: color-mix(in srgb, var(--accent-wash) 38%, transparent); border: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 12px; }
html:not(.js) .lp-live { margin: 0 0 1.1em; padding: 0; background: none; border: 0; }
.lp-live-tag { position: absolute; top: 0; left: calc(var(--pad) - 8px); display: inline-flex; align-items: center; gap: .45em; padding: 0 .7em; font-size: 12.5px; font-weight: 600; line-height: 1.75; letter-spacing: .02em; color: var(--paper); background: var(--accent); border-radius: 999px; transform: translateY(-55%); white-space: nowrap; }
.lp-live-tag small { font-size: inherit; font-weight: 400; opacity: .92; }
.lp-knob { margin: 0 .08em; padding: .04em .34em; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--accent-ink); white-space: nowrap; background: var(--accent-wash); border-radius: 7px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 1.5px 0 color-mix(in srgb, var(--accent) 45%, transparent); cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; transition: box-shadow .2s ease, background-color .2s ease; }
.lp-knob::before, .lp-knob::after { display: inline-block; font-weight: 700; color: var(--accent); transition: transform .2s var(--ease); }
.lp-knob::before { content: "‹"; margin-right: .22em; }
.lp-knob::after { content: "›"; margin-left: .22em; }
.lp-knob:hover, .lp-knob:focus-visible, .lp-knob.is-dragging { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.lp-knob:hover::before, .lp-knob:focus-visible::before, .lp-knob.is-dragging::before { transform: translateX(-3px); }
.lp-knob:hover::after, .lp-knob:focus-visible::after, .lp-knob.is-dragging::after { transform: translateX(3px); }
.lp-knob:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.lp-live.is-tweaked [data-out] { color: var(--ink); background: linear-gradient(var(--mark), var(--mark)) 0 88% / 100% .42em no-repeat; }
@media (prefers-reduced-motion: no-preference) {
  .lp-knob.is-peek { animation: lp-knob-glow 1.3s var(--ease) 2; }
  .lp-knob.is-peek::before { animation: lp-knob-left 1.3s var(--ease) 2; }
  .lp-knob.is-peek::after { animation: lp-knob-right 1.3s var(--ease) 2; }
}
@keyframes lp-knob-glow { 40% { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); } }
@keyframes lp-knob-left { 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes lp-knob-right { 35% { transform: translateX(5px); } 70% { transform: none; } }
html:not(.js) .lp-knob { padding: 0; font-weight: inherit; color: inherit; background: none; box-shadow: none; cursor: auto; }
html:not(.js) .lp-knob::before, html:not(.js) .lp-knob::after { content: none; }
.lp-live-reset { margin-left: .5em; padding: 0 .7em; font: inherit; font-size: 13px; line-height: 1.8; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; }
.lp-live-reset:hover { color: var(--ink); border-color: var(--ink-faint); }
/* 拨盘的浮层：取值一排，当前值实心；第一次读到可调段落时，浮层先在第一个拨盘上提示一次 */
.lp-pop .lp-pop-vals { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.lp-pop .lp-pop-vals i { padding: 0 7px; font: 12.5px/1.7 var(--font-mono); font-style: normal; color: var(--ink-soft); background: var(--raised); border-radius: 999px; }
.lp-pop .lp-pop-vals i.is-on { color: var(--paper); background: var(--accent); }
.lp-pop.is-knob { max-width: min(430px, calc(100vw - 32px)); }
.lp-pop.is-knob b { font-family: var(--font-sans); }
.lp-pop.is-intro { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent), var(--shadow); }
.lp-pop.is-intro::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: var(--paper); border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); transform: rotate(45deg); }
.lp-pop.is-intro.is-below::after { top: -7px; bottom: auto; transform: rotate(225deg); }
@media (max-width: 639px) { .lp-live { --pad: 12px; margin-left: -10px; margin-right: -10px; } }

/* 圈注：导师用笔圈出的关键数字，滚到时一笔圈上 */
.lp-ring { position: relative; white-space: nowrap; }
.lp-ring::after { content: ""; position: absolute; inset: -.16em -.4em -.1em; border: 2px solid var(--accent); border-radius: 52% 46% 55% 44% / 58% 50% 48% 44%; transform: rotate(-3deg); pointer-events: none; clip-path: inset(0 0 0 0); transition: clip-path .9s var(--ease) .15s; }
.lp-motion .lp-ring:not(.is-drawn)::after { clip-path: inset(0 100% 0 0); }

/* 学习地层：右侧一根地层柱，按内容加入的先后分层；图例里点一层只看这一层 */
.lp-strata-col { position: absolute; top: 0; right: -30px; width: 10px; pointer-events: none; }
/* 伸进批注栏的宽图压在地层柱上面：柱子不切过图里的内容，也不挡图里的点击 */
.lp-strata .lp-main .lp-figure.is-wide { position: relative; z-index: 1; }
.lp-strata-col > i { position: absolute; left: 0; right: 0; background: var(--layer); border-radius: 3px; box-shadow: 0 0 0 2px var(--paper); pointer-events: auto; }
@media (max-width: 1099px) { .lp-strata-col { right: -13px; width: 6px; } }
.lp-strata .lp-main [data-layer] { transition: opacity .3s ease; }
.lp-strata .lp-main .is-layer-dim { opacity: .28; }
.lp-strata .lp-main .is-layer-focus { outline: 2px solid var(--layer); outline-offset: 8px; border-radius: 6px; }
.lp-strata-legend { position: fixed; z-index: 44; left: 20px; bottom: 20px; width: min(300px, calc(100vw - 40px)); max-height: 60vh; overflow: auto; padding: 12px 12px 10px; font-size: 13.5px; line-height: 1.5; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); }
.lp-strata-legend h2 { display: flex; align-items: center; justify-content: flex-start; margin: 0 0 8px !important; font-size: 14px !important; }
.lp-strata-legend h2 button { margin-left: auto; padding: 0 8px; font: inherit; font-size: 12.5px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; }
.lp-strata-legend ol { margin: 0 !important; padding: 0 !important; list-style: none; }
.lp-strata-legend li { margin: 0 !important; }
.lp-strata-legend li button { display: grid; grid-template-columns: 14px 1fr; gap: 0 10px; width: 100%; padding: 6px 6px; font: inherit; text-align: left; color: inherit; background: none; border: 0; border-radius: 8px; cursor: pointer; }
.lp-strata-legend li button::before { content: ""; grid-row: span 2; width: 14px; height: 100%; min-height: 30px; background: var(--layer); border-radius: 3px; }
.lp-strata-legend li button:hover, .lp-strata-legend li button[aria-pressed="true"] { background: var(--raised); }
.lp-strata-legend b { font-weight: 600; }
.lp-strata-legend small { color: var(--ink-soft); font-size: 12.5px; }
@media (max-width: 639px) { .lp-strata-legend { left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 45vh; } }
/* 宽屏左栏是目录和小地铁，图例放到右下角，不挡目录 */
@media (min-width: 1280px) { .lp-strata-legend { left: auto; right: 20px; width: 280px; } }
.lp-review .lp-strata-legend { bottom: 72px; }

/* 时光机：图例顶上的滑块，轨道按层着色；拖到早先的一层时后来的块先藏起来 */
@media screen { .lp-strata .lp-main .is-future { display: none !important; } }
.lp-strata-time { margin: 0 0 10px; padding: 8px 10px 9px; background: var(--raised); border-radius: 8px; }
.lp-strata-time label { display: grid; grid-template-columns: auto minmax(0, 1fr) 4.2em; align-items: center; gap: 10px; font-weight: 600; }
.lp-strata-time input { --track: linear-gradient(90deg, transparent var(--p, 100%), color-mix(in srgb, var(--raised) 72%, transparent) 0), var(--strata); width: 100%; height: 20px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
.lp-strata-time input::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--track); }
.lp-strata-time input::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track); }
.lp-strata-time input::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -2px; background: var(--paper); border: 3px solid var(--ink); border-radius: 50%; -webkit-appearance: none; }
.lp-strata-time input::-moz-range-thumb { width: 12px; height: 12px; background: var(--paper); border: 3px solid var(--ink); border-radius: 50%; }
.lp-strata-legend li button.is-future { color: var(--ink-faint); }
.lp-strata-legend li button.is-future::before { background: repeating-linear-gradient(-45deg, var(--paper) 0 2px, transparent 0 5px), var(--layer); opacity: .6; }
.lp-strata-time output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); }
.lp-travel .lp-strata-time output { color: var(--accent-ink); }
.lp-strata-time small { display: block; margin-top: 3px; font-size: 12px; }
@media (pointer: coarse) {
  .lp-strata-legend h2 button { min-width: 44px; min-height: 44px; }
  .lp-strata-time input { height: 44px; }
  .lp-strata-time input::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -7px; }
  .lp-strata-time input::-moz-range-thumb { width: 22px; height: 22px; }
}
.lp-travel .lp-strata-legend { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

/* 小地铁：宽屏目录栏顶上的竖线路，当前一节讲到的站亮起，之前的站算已经过 */
.lp-minimetro { margin: 0 0 26px; font-size: 13px; line-height: 1.45; }
.lp-minimetro > p { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .1em; color: var(--ink-faint); }
.lp-minimetro-line { position: relative; }
.lp-minimetro ol { position: static; margin: 0; padding: 0 4px; list-style: none; }
.lp-minimetro li { position: relative; margin: 0; padding: 4px 0 4px 24px; }
.lp-minimetro li::before { content: ""; position: absolute; z-index: 1; left: 2px; top: calc(4px + .725em - 6px); width: 12px; height: 12px; background: var(--station); border: 3px solid var(--line); border-radius: 50%; transition: background-color .3s ease; }
.lp-minimetro-line > i { position: absolute; left: 0; right: 0; top: 0; height: 0; background: color-mix(in srgb, var(--line) 13%, transparent); border-radius: 12px; transition: top .45s var(--ease), height .45s var(--ease); }
.lp-minimetro li:not(:last-child)::after { content: ""; position: absolute; left: 6.5px; top: calc(4px + .725em); bottom: calc(-4px - .725em); border-left: 3px solid var(--line); }
.lp-minimetro li.to-fog::after, .lp-minimetro li.is-fog::after { border-left-style: dashed; border-left-color: var(--line-idle); }
.lp-minimetro li.is-fog::before { border-style: dashed; border-color: var(--line-idle); }
.lp-minimetro a, .lp-minimetro span { display: block; padding: 0; overflow: hidden; color: var(--ink-faint); text-decoration: none; text-overflow: ellipsis; white-space: nowrap; border: 0; }
.lp-minimetro li.is-fog > * { opacity: .7; }
.lp-minimetro li.is-past a { color: var(--ink-soft); }
.lp-minimetro a:hover { color: var(--ink); }
.lp-minimetro li:is(.is-here, .is-past)::before { background: var(--line); }
.lp-minimetro li.is-here a { font-weight: 600; color: var(--ink); }

/* 深链聚光：四周暗下来，目标四周一圈光，上面一枚小标签 */
.lp-spot { position: fixed; z-index: 48; left: 0; top: 0; border-radius: var(--round); pointer-events: none; box-shadow: 0 0 0 2px var(--accent), 0 0 0 9px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 0 200vmax color-mix(in srgb, var(--stage) 40%, transparent); transition: opacity .6s ease; }
.lp-spot.is-out { opacity: 0; }
.lp-spot.is-tight > span { top: 8px; left: auto; right: 14px; transform: none; }
.lp-spot > span { position: absolute; left: 14px; top: 0; transform: translateY(-50%); padding: 1px 10px; font-size: 12.5px; font-weight: 600; line-height: 1.7; color: var(--paper); white-space: nowrap; background: var(--accent); border-radius: var(--round); }
@media (prefers-reduced-motion: no-preference) { .lp-spot { animation: lp-spot-in .7s var(--ease) both; } }
@keyframes lp-spot-in { from { box-shadow: 0 0 0 2px transparent, 0 0 0 48px transparent, 0 0 0 200vmax transparent; } }

/* 工具多了时换行 */
.lp-headbar { flex-wrap: wrap; }
.lp-tools { flex-wrap: wrap; justify-content: flex-end; }
@media print {
  .lp-strata-legend, .lp-strata-col, .lp-live-tag, .lp-live-reset, .lp-mist, .lp-spot, .lp-minimetro { display: none !important; }
  .lp-stages > li.is-fog > * { opacity: 1 !important; filter: none !important; }
  .lp-strata .lp-main .is-layer-dim { opacity: 1; transition: none; }
  .lp-strata .lp-main .is-layer-focus { outline: 0; }
  .lp-live { margin: 0 0 1.1em; padding: 0; background: none; border: 0; }
  .lp-knob { padding: 0; background: none; box-shadow: none; }
  .lp-knob::before, .lp-knob::after { content: none; }
}
</style>
<style id="lp-page-style">
/* 整页生效的少量调整写在这里；部件样式随片段写 <style data-lp-style>。颜色只用 var(--…) 令牌。 */
</style>
</head>
<body>
<header class="lp-cover">
  <div class="lp-cover-in">
    <div class="lp-cover-body">
      <div class="lp-headbar">
        <p class="lp-crumb">{{lp:crumb}}</p>
        <div class="lp-tools"><button type="button" data-lp-strata aria-pressed="false">地层</button><button type="button" data-lp-review aria-pressed="false">只看要点</button><button type="button" data-lp-theme aria-pressed="false">深色</button></div>
      </div>
      <h1 class="lp-title">{{lp:title}}</h1>
      <div class="lp-meta">
        {{lp:spine}}
        <p data-lp-auto="minutes"></p>
        <p data-lp-auto="date">更新于 {{lp:date}}</p>
      </div>
      <p class="lp-updated" data-lp-auto="updated"></p>
    </div>
  </div>
</header>
<div class="lp-page">
  <aside class="lp-toc" aria-label="本页目录"><nav></nav></aside>
  <main class="lp-main" id="top">
    <details class="lp-toc-inline"><summary>本页目录</summary><nav></nav></details>
<!-- lp:content -->
<!-- lp:append -->
    <section class="lp-glossary" id="glossary" aria-labelledby="glossary-title">
      <h2 id="glossary-title">符号与名词</h2>
      <dl id="glossary-list">
      </dl>
    </section>
    <footer class="lp-sources" id="sources">
      <h2>来源</h2>
      <ol id="sources-list">
{{lp:sources}}
      </ol>
    </footer>
  </main>
</div>
<script id="lp-runtime">
/* lesson-pages runtime v3。页面不要修改本段；本页专用的部件逻辑写进带 data-lp-hook 的脚本。 */
(function () {
  "use strict";
  var root = document.documentElement;
  var LP = window.LessonPage;
  var main = document.querySelector(".lp-main");
  var meta = document.querySelector('meta[name="lesson-pages"]');
  var pageId = meta ? meta.getAttribute("data-id") : "page";
  var pageKey = meta && meta.getAttribute("data-key") ? meta.getAttribute("data-key") : pageId + ":" + window.location.pathname;
  var rev = meta ? parseInt(meta.getAttribute("data-rev") || "1", 10) : 1;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var freshSince = rev - 1;

  function $all(selector, scope) { return Array.prototype.slice.call((scope || document).querySelectorAll(selector)); }
  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (error) { return null; }
    return null;
  }
  function parseRanges(text) {
    var set = {};
    String(text || "").split(",").forEach(function (part) {
      var bounds = part.trim().split("-");
      if (!bounds[0]) return;
      var start = parseInt(bounds[0], 10), end = bounds.length > 1 ? parseInt(bounds[1], 10) : start;
      for (var n = start; n <= end; n += 1) set[n] = true;
    });
    return set;
  }
  function splitIds(text) { return String(text || "").split(/[\s,]+/).filter(Boolean); }
  /* 锚点的 id：解不开的百分号编码按原文用，坏链接不在控制台报错。 */
  function idOf(hash) {
    var raw = String(hash || "").replace(/^#/, "");
    try { return decodeURIComponent(raw); } catch (error) { return raw; }
  }
  function plainText(node) {
    var clone = node.cloneNode(true);
    $all(".lp-new, .lp-oral-time, .katex-mathml, rt, rp, .lp-soon, .lp-xfer, .lp-mist, .lp-seal, .lp-live-tag", clone).forEach(function (child) { child.remove(); });
    var number = clone.querySelector(".lp-no");
    if (number) number.textContent = number.textContent.trim() + " ";
    var kind = clone.querySelector(".lp-kind");
    if (kind) kind.textContent = " · " + kind.textContent.trim();
    return clone.textContent.replace(/\s+/g, " ").trim();
  }
  function readable(node) {
    var clone = node.cloneNode(true);
    $all("script, style, template, .lp-where, .lp-toc-inline, .lp-controls, .katex-mathml, .lp-code-head, .lp-copy-tex, rt, rp, .lp-live-tag, .lp-live-reset, .lp-mist, .lp-soon, .lp-xfer", clone).forEach(function (child) { child.remove(); });
    return clone.textContent || "";
  }
  function failed(widget, error) {
    console.error("lesson-pages widget " + (widget.id || ""), error);
    var note = widget.querySelector(".lp-widget-error");
    if (!note) {
      note = document.createElement("p");
      note.className = "lp-widget-error";
      note.setAttribute("role", "status");
      widget.appendChild(note);
    }
    note.textContent = "这个交互部件没有正常运行，正文内容不受影响。" + (error && error.message ? "（" + error.message + "）" : "");
  }
  function recovered(widget) {
    var note = widget.querySelector(".lp-widget-error");
    if (note) note.remove();
  }
  function readingMinutes(nodes) {
    var cjk = 0, words = 0;
    nodes.forEach(function (node) {
      var text = readable(node);
      cjk += (text.match(/[㐀-鿿]/g) || []).length;
      words += (text.replace(/[㐀-鿿]/g, " ").match(/[A-Za-z0-9_]+/g) || []).length;
    });
    return Math.max(1, Math.round(cjk / 320 + words / 180));
  }
  function copyText(text, button, done) {
    if (!button.lpLabel) button.lpLabel = button.textContent;
    var finish = function (ok) {
      button.textContent = ok ? done : "复制失败";
      button.classList.add("is-done");
      window.clearTimeout(button.lpReset);
      button.lpReset = window.setTimeout(function () { button.textContent = button.lpLabel; button.classList.remove("is-done"); }, 1400);
    };
    var fallback = function () {
      var area = document.createElement("textarea");
      area.value = text; area.setAttribute("readonly", ""); area.className = "lp-visually-hidden";
      document.body.appendChild(area); area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (error) { ok = false; }
      area.remove();
      button.focus({ preventScroll: true });
      finish(ok);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { finish(true); }, fallback);
    else fallback();
  }
  /* 数字读数：数值变化时从旧值过渡到新值，位数按新值定，过程中不跳位。 */
  function digitsFor(value) { return Math.abs(value) >= 100 ? 0 : Math.abs(value) >= 10 ? 1 : 2; }
  function setNumber(node, value, digits) {
    var before = node.lpValue;
    node.lpValue = value;
    var format = function (v) { return LP.fmt.num(v, digits == null && typeof value === "number" && isFinite(value) ? digitsFor(value) : digits); };
    if (node.lpFrame) window.cancelAnimationFrame(node.lpFrame);
    var changed = before !== undefined && !(before === value || (before !== before && value !== value));
    if (changed && !reduceMotion) {
      node.classList.remove("is-changed"); void node.offsetWidth; node.classList.add("is-changed");
      window.clearTimeout(node.lpFlash);
      node.lpFlash = window.setTimeout(function () { node.classList.remove("is-changed"); }, 60);
    }
    if (!changed || reduceMotion || typeof value !== "number" || typeof before !== "number" || !isFinite(value) || !isFinite(before)) {
      node.textContent = typeof value === "number" ? format(value) : LP.fmt.num(value, digits);
      return;
    }
    var start = 0;
    var step = function (time) {
      if (!start) start = time;
      var t = Math.min(1, (time - start) / 380), eased = 1 - Math.pow(1 - t, 3);
      node.textContent = format(t < 1 ? before + (value - before) * eased : value);
      if (t < 1) node.lpFrame = window.requestAnimationFrame(step);
    };
    node.lpFrame = window.requestAnimationFrame(step);
  }
  LP.setNumber = setNumber;

  /* 浮层：符号释义和拨盘的取值共用一个；kind 记下是谁打开的，各自只收起自己的。 */
  var pop = null, popFor = null, popKind = "";
  function hidePop(kind) {
    if (pop && (!kind || popKind === kind)) { pop.remove(); pop = null; popFor = null; popKind = ""; }
  }
  function showPop(target, kind, fill) {
    if (popFor !== target || popKind !== kind) {
      hidePop();
      pop = document.createElement("div");
      pop.setAttribute("role", "tooltip");
      document.body.appendChild(pop);
      popFor = target; popKind = kind;
    }
    pop.className = "lp-pop";
    pop.textContent = "";
    fill(pop);
    var box = target.getBoundingClientRect(), width = pop.offsetWidth, height = pop.offsetHeight;
    var left = Math.max(12, Math.min(window.innerWidth - width - 12, box.left + box.width / 2 - width / 2));
    var below = box.top - height - 10 < 8;
    pop.classList.toggle("is-below", below);
    pop.style.setProperty("--arrow", Math.max(14, Math.min(width - 14, box.left + box.width / 2 - left)) + "px");
    pop.style.left = (left + window.scrollX) + "px";
    pop.style.top = ((below ? box.bottom + 10 : box.top - height - 10) + window.scrollY) + "px";
  }

  function announce(text) {
    var region = document.getElementById("lp-status");
    if (!region) {
      region = document.createElement("div");
      region.id = "lp-status"; region.className = "lp-visually-hidden"; region.setAttribute("role", "status");
      document.body.appendChild(region);
    }
    region.textContent = "";
    window.setTimeout(function () { region.textContent = text; }, 30);
  }

  function initTheme() {
    $all("[data-lp-theme]").forEach(function (button) {
      function isDark() {
        var chosen = root.getAttribute("data-theme");
        return chosen ? chosen === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
      function sync() { button.textContent = "深色"; button.setAttribute("aria-pressed", isDark() ? "true" : "false"); }
      sync();
      button.addEventListener("click", function () {
        var next = isDark() ? "light" : "dark";
        root.setAttribute("data-theme", next);
        store("lesson-pages-theme", next);
        sync();
      });
    });
  }

  function initReview() {
    var buttons = $all("[data-lp-review]");
    if (!buttons.length) return;
    var exit = document.createElement("button");
    exit.type = "button"; exit.className = "lp-review-exit"; exit.textContent = "退出只看要点"; exit.hidden = true;
    document.body.appendChild(exit);
    var set = function (on) {
      root.classList.toggle("lp-review", on);
      buttons.forEach(function (button) { button.setAttribute("aria-pressed", on ? "true" : "false"); });
      exit.hidden = !on;
      document.dispatchEvent(new CustomEvent("lp:layout"));
    };
    buttons.forEach(function (button) {
      button.textContent = "只看要点";
      button.addEventListener("click", function () { set(!root.classList.contains("lp-review")); });
    });
    exit.addEventListener("click", function () { set(false); buttons[0].focus({ preventScroll: true }); });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && root.classList.contains("lp-review") && !document.querySelector(".lp-pop")) set(false);
    });
    /* 要点模式下点到或跳到被隐藏的内容时，先退出要点模式再定位。 */
    var hidden = function (id) {
      var target = id && document.getElementById(id);
      return target && !target.getClientRects().length ? target : null;
    };
    document.addEventListener("click", function (event) {
      var link = event.target.closest && event.target.closest('a[href^="#"]');
      if (link && root.classList.contains("lp-review") && hidden(idOf(link.getAttribute("href")))) set(false);
    }, true);
    window.addEventListener("hashchange", function () {
      var target = root.classList.contains("lp-review") && hidden(idOf(window.location.hash));
      if (target) { set(false); target.scrollIntoView(); }
    });
  }

  /* 新内容：上次打开以来加进来的块，包括加进旧节点里的补充和参考要点。 */
  function initFreshness() {
    var revOf = function (el) { return parseInt(el.getAttribute("data-rev"), 10) || 0; };
    var stamped = $all("main [data-rev]").filter(function (el) {
      var outer = el.parentElement.closest("[data-rev]");
      return !outer || revOf(outer) < revOf(el);
    });
    var key = "lesson-pages-seen:" + pageKey;
    var seen = parseInt(store(key) || "0", 10);
    var since = seen && seen < rev ? seen : rev - 1;
    freshSince = since;
    var fresh = rev > 1 ? stamped.filter(function (el) { return revOf(el) > since; }) : [];
    fresh.forEach(function (el) {
      el.classList.add("is-new");
      if (el.closest("#glossary, #sources")) return;
      var heading = el.querySelector("h2, h3, dt, summary, figcaption b");
      if (heading && !heading.querySelector(".lp-new")) {
        var badge = document.createElement("span");
        badge.className = "lp-new"; badge.textContent = "新"; badge.setAttribute("data-rev", String(revOf(el)));
        heading.appendChild(badge);
      }
    });
    var line = document.querySelector('[data-lp-auto="updated"]');
    if (line) {
      var targets = [];
      var add = function (target, label) {
        if (!target || !target.id || targets.some(function (item) { return item.target === target; })) return;
        targets.push({ target: target, label: label });
      };
      fresh.forEach(function (el) {
        var block = el.closest(".lp-main > [id]");
        if (el.id && (el.parentElement === main || el.querySelector("h2, h3"))) {
          var heading = el.querySelector("h2, h3");
          var answered = el.classList.contains("lp-check") && el.querySelector('.lp-answer[data-rev="' + revOf(el) + '"]');
          add(el, (heading ? plainText(heading) : el.id) + (answered ? " 的参考要点" : ""));
        } else if (block && block.id === "glossary") {
          add(block, "符号与名词");
        } else if (block && block.id === "sources") {
          add(block, "来源");
        } else if (block) {
          var title = block.querySelector("h2, h3");
          add(block, (title ? plainText(title) : block.id) + (el.classList.contains("lp-answer") ? "的参考要点" : "里的新内容"));
        }
      });
      if (targets.length) {
        line.textContent = "本次新增：";
        targets.slice(0, 6).forEach(function (item, i) {
          if (i) line.appendChild(document.createTextNode("、"));
          var link = document.createElement("a");
          link.href = "#" + item.target.id;
          link.textContent = item.label;
          line.appendChild(link);
        });
        var reading = fresh.filter(function (el) { return !el.closest("#glossary, #sources"); });
        if (reading.length) {
          var minutes = document.createElement("span");
          minutes.className = "nb"; minutes.textContent = "（约 " + readingMinutes(reading) + " 分钟）";
          line.appendChild(minutes);
        }
      } else {
        line.remove();
      }
    }
    var total = document.querySelector('[data-lp-auto="minutes"]');
    if (total && main) total.textContent = "本页约 " + readingMinutes([main]) + " 分钟";
    var updated = document.querySelector('[data-lp-auto="date"]');
    if (updated && meta) updated.textContent = "更新于 " + (meta.getAttribute("data-updated") || "");
    store(key, String(rev));
  }

  /* 目录：当前位置取视口上部 30% 处最后一个块；隐藏的块不列出。 */
  function initToc() {
    var navs = $all(".lp-toc nav, .lp-toc-inline nav");
    if (!navs.length) return;
    var headings = $all(".lp-main > section:not([hidden]) > h2, .lp-main > section.lp-check > h3, .lp-main > footer:not([hidden]) > h2, .lp-main > section > .lp-addendum > h3");
    var entries = [];
    headings.forEach(function (heading) {
      var parent = heading.parentElement;
      var target = parent.id ? parent : heading;
      if (target.id) entries.push({ target: target, sub: heading.tagName === "H3", text: plainText(heading) });
    });
    if (!entries.length) { $all(".lp-toc-inline").forEach(function (box) { box.hidden = true; }); return; }
    var lists = navs.map(function (nav) {
      var list = document.createElement("ol");
      var links = entries.map(function (entry) {
        var item = document.createElement("li");
        if (entry.sub) item.className = "lp-toc-sub";
        var link = document.createElement("a");
        link.href = "#" + entry.target.id;
        link.textContent = entry.text;
        item.appendChild(link);
        list.appendChild(item);
        return link;
      });
      nav.appendChild(list);
      return links;
    });
    var markers = navs.map(function (nav) {
      var marker = document.createElement("span");
      marker.className = "lp-toc-marker"; marker.setAttribute("aria-hidden", "true");
      nav.querySelector("ol").appendChild(marker);
      return marker;
    });
    var frame = 0, lastNode = null;
    var update = function () {
      frame = 0;
      var limit = window.innerHeight * 0.3, current = -1;
      var visible = entries.map(function (entry) { return entry.target.getClientRects().length > 0; });
      entries.forEach(function (entry, i) {
        if (visible[i] && entry.target.getBoundingClientRect().top <= limit) current = i;
      });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
        for (var i = entries.length - 1; i >= 0; i -= 1) { if (visible[i]) { current = i; break; } }
      }
      lists.forEach(function (links, n) {
        links.forEach(function (link, i) {
          link.setAttribute("aria-current", i === current ? "true" : "false");
          link.classList.toggle("is-past", i < current);
          link.parentElement.hidden = !visible[i];
        });
        var active = links[current];
        markers[n].style.height = active && active.offsetHeight ? active.offsetHeight + "px" : "0";
        if (active) markers[n].style.transform = "translateY(" + active.offsetTop + "px)";
      });
      var node = current >= 0 ? entries[current].target.closest(".lp-node") : null;
      if (node !== lastNode) {
        if (lastNode) lastNode.classList.remove("is-current");
        if (node) node.classList.add("is-current");
        lastNode = node;
        document.dispatchEvent(new CustomEvent("lp:node", { detail: node }));
      }
    };
    var schedule = function () { if (!frame) frame = window.requestAnimationFrame(update); };
    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule);
    document.addEventListener("lp:layout", schedule);
    update();
  }

  /* 地铁线路：骨架的每个阶段是一站。讲过的站已通车，链接到第一次讲它的节点；被几个节点讲到的是换乘站；
     没讲的站在建、蒙着雾，上次打开以来新通车的站当场散雾。每个节点开头挂一块站牌：上一站、本站、下一站。 */
  function initWhere() {
    var stages = $all(".lp-stages > li[id]");
    if (!stages.length) return;
    var nodes = $all(".lp-node[data-stages]");
    var teachers = {}, order = [];
    /* 分了页的课：页头分页目录里别的页列出的节点也讲过它们的站，按页序排进来，链到那一页 */
    var pages = $all("#lp-pager .lp-pager-list > ol > li");
    pages.forEach(function (li) { order = order.concat(li.hasAttribute("aria-current") ? nodes : $all("a[data-stages]", li)); });
    (pages.length ? order : nodes).forEach(function (node) {
      splitIds(node.getAttribute("data-stages")).forEach(function (id) { (teachers[id] = teachers[id] || []).push(node); });
    });
    var hrefOf = function (node) { return node.id ? "#" + node.id : node.getAttribute("href"); };
    var revOf = function (el) { return parseInt(el.getAttribute("data-rev"), 10) || 0; };
    var taughtBy = function (stage) { return stage ? teachers[stage.id] || [] : []; };
    /* 本页也讲这一站时链本页的节点，免得点一下就去了别的页 */
    var mainOf = function (taught) { return taught.filter(function (node) { return node.id; })[0] || taught[0]; };
    var nameOf = function (stage) { return stage.getAttribute("data-label") || plainText(stage.querySelector("b") || stage); };
    var numberOf = function (node) { var no = node.querySelector(node.id ? ":scope > h2 .lp-no" : "b"); return no ? no.textContent.trim() : node.id; };
    var mist = function (stage) {
      var cloud = document.createElement("span");
      cloud.className = "lp-mist"; cloud.setAttribute("aria-hidden", "true");
      stage.appendChild(cloud);
      return cloud;
    };
    stages.forEach(function (stage, index) {
      var taught = taughtBy(stage), open = taught.length > 0;
      stage.classList.toggle("is-open", open);
      stage.classList.toggle("is-fog", !open);
      stage.classList.toggle("is-interchange", taught.length > 1);
      if (stages[index + 1]) stage.classList.toggle("to-fog", !taughtBy(stages[index + 1]).length);
      var label = stage.querySelector("b") || stage;
      if (open && !label.querySelector("a")) {
        var link = document.createElement("a");
        link.href = hrefOf(mainOf(taught));
        while (label.firstChild) link.appendChild(label.firstChild);
        label.appendChild(link);
      }
      if (taught.length > 1) {
        var xfer = document.createElement("span");
        xfer.className = "lp-xfer";
        xfer.appendChild(document.createTextNode("换乘"));
        taught.forEach(function (node) {
          var hop = document.createElement("a");
          hop.href = hrefOf(node); hop.textContent = "第 " + numberOf(node) + " 节";
          xfer.appendChild(hop);
        });
        stage.appendChild(xfer);
      }
      if (!open) {
        var soon = document.createElement("span");
        soon.className = "lp-soon"; soon.textContent = "未开通";
        label.appendChild(soon);
        mist(stage);
      } else if (rev > 1 && revOf(taught[0]) > freshSince && !reduceMotion) {
        var cloud = mist(stage);
        stage.classList.add("is-clearing");
        cloud.addEventListener("animationend", function () { cloud.remove(); stage.classList.remove("is-clearing"); });
      }
    });
    nodes.forEach(function (node) {
      var indices = splitIds(node.getAttribute("data-stages")).map(function (id) {
        for (var i = 0; i < stages.length; i += 1) if (stages[i].id === id) return i;
        return -1;
      }).filter(function (i) { return i >= 0; }).sort(function (a, b) { return a - b; });
      if (!indices.length) return;
      var sign = document.createElement("nav");
      sign.className = "lp-where lp-sign";
      sign.setAttribute("aria-label", "本节在全流程中的位置");
      var end = function (stage, role) {
        if (!stage) {
          var none = document.createElement("span");
          none.className = "lp-sign-end" + (role === "next" ? " lp-sign-next" : "");
          none.innerHTML = "<small></small>";
          none.firstChild.textContent = role === "prev" ? "起点站" : "终点站";
          return none;
        }
        var taught = taughtBy(stage), hop = document.createElement("a");
        hop.className = "lp-sign-" + role + (taught.length ? "" : " is-fog");
        hop.href = taught.length ? hrefOf(mainOf(taught)) : "#" + stage.id;
        hop.innerHTML = "<small></small><span></span>";
        hop.firstChild.textContent = (role === "prev" ? "上一站" : "下一站") + (taught.length ? "" : " · 未开通");
        hop.lastChild.textContent = nameOf(stage);
        return hop;
      };
      sign.appendChild(end(stages[indices[0] - 1], "prev"));
      var here = document.createElement("div");
      here.className = "lp-sign-here"; here.setAttribute("aria-current", "step");
      here.innerHTML = "<small>本站</small>";
      indices.forEach(function (i) {
        var name = document.createElement("span");
        name.textContent = nameOf(stages[i]);
        here.appendChild(name);
      });
      sign.appendChild(here);
      sign.appendChild(end(stages[indices[indices.length - 1] + 1], "next"));
      var line = document.createElement("ol");
      line.className = "lp-sign-line"; line.setAttribute("aria-hidden", "true");
      stages.forEach(function (stage, i) {
        var dot = document.createElement("li");
        if (indices.indexOf(i) >= 0) dot.className = "is-here";
        else if (!taughtBy(stage).length) dot.className = "is-fog";
        line.appendChild(dot);
      });
      sign.appendChild(line);
      var anchor = node.querySelector(":scope > .lp-spine") || node.querySelector(":scope > h2");
      if (anchor) anchor.insertAdjacentElement("afterend", sign);
    });
    /* 小地铁：宽屏目录栏顶上一条竖线路，读到哪一节，它讲的站就亮起来，之前的站算已经过。 */
    var nav = document.querySelector(".lp-toc nav");
    if (!nav) return;
    var mini = document.createElement("div");
    mini.className = "lp-minimetro";
    mini.innerHTML = '<p>线路</p><div class="lp-minimetro-line"><i aria-hidden="true"></i><ol></ol></div>';
    var list = mini.querySelector("ol"), pill = mini.querySelector(".lp-minimetro-line > i"), current = null;
    var dots = stages.map(function (stage, i) {
      var taught = taughtBy(stage), item = document.createElement("li"), hop = document.createElement(taught.length ? "a" : "span");
      if (taught.length) hop.href = hrefOf(mainOf(taught));
      hop.textContent = nameOf(stage);
      item.className = taught.length ? "is-open" : "is-fog";
      if (stages[i + 1] && !taughtBy(stages[i + 1]).length) item.classList.add("to-fog");
      item.appendChild(hop);
      list.appendChild(item);
      return item;
    });
    nav.insertBefore(mini, nav.firstChild);
    var light = function (node) {
      current = node;
      var here = node ? splitIds(node.getAttribute("data-stages")) : [], first = -1, last = -1;
      dots.forEach(function (dot, i) {
        var on = here.indexOf(stages[i].id) >= 0;
        if (on) { if (first < 0) first = i; last = i; }
        dot.classList.toggle("is-here", on);
        if (on) dot.firstChild.setAttribute("aria-current", "step"); else dot.firstChild.removeAttribute("aria-current");
      });
      dots.forEach(function (dot, i) { dot.classList.toggle("is-past", first > i); });
      /* 本节讲的几站套进胶囊，换节时滑过去 */
      pill.style.top = (first < 0 ? 0 : dots[first].offsetTop) + "px";
      pill.style.height = (first < 0 ? 0 : dots[last].offsetTop + dots[last].offsetHeight - dots[first].offsetTop) + "px";
    };
    document.addEventListener("lp:node", function (event) { light(event.detail); });
    light(document.querySelector(".lp-node.is-current"));
    /* 窄屏时目录栏不显示，量出来是 0；变宽后重新量一次胶囊 */
    if (window.ResizeObserver) new ResizeObserver(function () { light(current); }).observe(list);
  }

  /* 骨架阶段链按自身宽度均匀分行，行末不留悬空箭头；太窄时竖排。 */
  function initFlows() {
    $all(".lp-flow").forEach(function (flow) {
      var items = $all(":scope > li", flow);
      items.forEach(function (item, i) { item.style.setProperty("--i", String(i)); });
      var layout = function () {
        var width = flow.clientWidth;
        if (!width || !items.length) return;
        var n = items.length, columns = Math.min(n, Math.max(1, Math.floor((width + 12) / 140)));
        if (columns < Math.min(n, 3)) columns = 1;
        if (columns > 1 && columns < n) columns = Math.ceil(n / Math.ceil(n / columns));
        flow.classList.add("is-laid-out");
        flow.classList.toggle("is-vertical", columns === 1);
        flow.style.gridTemplateColumns = columns > 1 ? "repeat(" + columns + ", minmax(0, 1fr))" : "";
        items.forEach(function (item, i) { item.classList.toggle("is-row-end", columns > 1 && (i + 1) % columns === 0); });
      };
      layout();
      if (window.ResizeObserver) new ResizeObserver(layout).observe(flow);
      else window.addEventListener("resize", layout);
    });
  }

  /* 代码行：保留行内标记（符号色、mark），去掉开头的空行。 */
  function splitLines(code) {
    var lines = [document.createElement("span")];
    var append = function (ancestors, textNode) {
      var parent = lines[lines.length - 1];
      ancestors.forEach(function (ancestor) {
        var last = parent.lastChild;
        if (last && last.lpSource === ancestor) { parent = last; return; }
        var clone = ancestor.cloneNode(false);
        clone.lpSource = ancestor;
        parent.appendChild(clone);
        parent = clone;
      });
      parent.appendChild(textNode);
    };
    var walk = function (node, ancestors) {
      Array.prototype.forEach.call(node.childNodes, function (child) {
        if (child.nodeType === 3) {
          child.nodeValue.split("\n").forEach(function (part, i) {
            if (i) lines.push(document.createElement("span"));
            if (part) append(ancestors, document.createTextNode(part));
          });
        } else if (child.nodeType === 1) {
          walk(child, ancestors.concat([child]));
        }
      });
    };
    walk(code, []);
    if (lines.length > 1 && !lines[0].textContent && /^\r?\n/.test(code.textContent)) lines.shift();
    if (lines.length > 1 && !lines[lines.length - 1].textContent) lines.pop();
    return lines;
  }

  function initCode() {
    $all("pre.lp-code > code").forEach(function (code) {
      var pre = code.parentElement;
      var start = parseInt(pre.getAttribute("data-start") || "1", 10);
      var on = parseRanges(pre.getAttribute("data-highlight"));
      var source = code.textContent.replace(/^\r?\n/, "").replace(/\n$/, "");
      var lines = splitLines(code);
      code.textContent = "";
      lines.forEach(function (span, index) {
        var n = start + index;
        span.className = "lp-line" + (on[n] ? " is-on" : "");
        span.setAttribute("data-n", String(n));
        if (!span.textContent) span.textContent = " ";
        code.appendChild(span);
      });
      var head = document.createElement("div");
      head.className = "lp-code-head";
      var lang = pre.getAttribute("data-lang"), title = pre.getAttribute("data-title");
      if (lang) { var tag = document.createElement("span"); tag.className = "lp-code-lang"; tag.textContent = lang; head.appendChild(tag); }
      if (title) { var name = document.createElement("span"); name.className = "lp-code-title"; name.textContent = title; head.appendChild(name); }
      var copy = document.createElement("button");
      copy.type = "button"; copy.className = "lp-code-copy"; copy.textContent = "复制";
      copy.setAttribute("aria-label", "复制这段代码");
      copy.addEventListener("click", function () { copyText(source, copy, "已复制"); });
      head.appendChild(copy);
      pre.parentNode.insertBefore(head, pre);
    });
    $all("ol.lp-code-notes").forEach(function (list) {
      var before = function (el) {
        do { el = el.previousElementSibling; } while (el && el.matches("script, style, template"));
        return el;
      };
      var pre = before(list);
      if (pre && pre.classList.contains("lp-code-src")) pre = before(pre);
      if (!pre || !pre.matches("pre.lp-code")) return;
      pre.classList.add("has-notes");
      var lines = $all(".lp-line", pre), pinned = null;
      var notes = $all(":scope > li[data-lines]", list).map(function (item, index) {
        var set = parseRanges(item.getAttribute("data-lines"));
        var mine = lines.filter(function (line) { return set[parseInt(line.getAttribute("data-n"), 10)]; });
        if (mine[0] && !mine[0].hasAttribute("data-note")) mine[0].setAttribute("data-note", String(index + 1));
        item.setAttribute("tabindex", "0");
        return { item: item, lines: mine };
      });
      var focus = function (note) {
        pre.classList.toggle("is-focusing", !!note);
        lines.forEach(function (line) { line.classList.toggle("is-focus", !!note && note.lines.indexOf(line) >= 0); });
        notes.forEach(function (other) {
          other.item.classList.toggle("is-focus", other === note);
          other.item.classList.toggle("is-pinned", other === pinned);
        });
      };
      /* 宽屏时说明放进批注栏，各自对齐到所讲的第一行；返回最后一条的底边，供页边批注避让。 */
      list.lpLayout = function (floor) {
        if (!pre.getClientRects().length) return -Infinity;
        var wide = window.matchMedia && window.matchMedia("(min-width: 1100px)").matches;
        var side = wide && list.offsetParent === main && pre.offsetParent === main;
        list.classList.toggle("is-side", side);
        pre.style.marginBottom = "";
        notes.forEach(function (note) { note.item.style.top = ""; });
        if (!side) return -Infinity;
        list.style.top = pre.offsetTop + "px";
        var origin = list.getBoundingClientRect().top, lowest = Math.max(0, floor - origin), next = lowest;
        var placed = notes.map(function (note) {
          var anchor = note.lines[0] ? note.lines[0].getBoundingClientRect().top - origin - 4 : next;
          var top = Math.max(anchor, next);
          next = top + note.item.offsetHeight + 10;
          return { note: note, anchor: anchor, top: top };
        });
        /* 被前一条挤下去的说明会越积越低；整组上移一点，把偏差平分到所讲行的上下，但不越过上方的批注。 */
        if (placed.length) {
          var drifts = placed.map(function (entry) { return entry.top - entry.anchor; });
          var shift = Math.max(0, Math.min((Math.max.apply(null, drifts) + Math.min.apply(null, drifts)) / 2, placed[0].top - lowest));
          placed.forEach(function (entry) { entry.note.item.style.top = (entry.top - shift) + "px"; });
          next -= shift;
        }
        /* 说明比代码长时伸进批注栏下方；只有后面的宽图会伸进批注栏，被压到时才把正文往下推。 */
        var bottom = origin + next;
        var blocker = $all(".lp-figure.is-wide", main).filter(function (figure) {
          return list.compareDocumentPosition(figure) & Node.DOCUMENT_POSITION_FOLLOWING && figure.getBoundingClientRect().top < bottom;
        })[0];
        if (blocker) pre.style.marginBottom = (bottom - blocker.getBoundingClientRect().top + 24) + "px";
        return bottom;
      };
      notes.forEach(function (note) {
        note.item.addEventListener("mouseenter", function () { if (!pinned) focus(note); });
        note.item.addEventListener("mouseleave", function () { focus(pinned); });
        note.item.addEventListener("focus", function () { focus(note); });
        note.item.addEventListener("blur", function () { focus(pinned); });
        note.item.addEventListener("click", function () {
          pinned = pinned === note ? null : note;
          focus(pinned || note);
          if (pinned && note.lines[0]) {
            var box = pre.getBoundingClientRect(), row = note.lines[0].getBoundingClientRect();
            if (row.top < box.top || row.bottom > box.bottom || row.top < 0 || row.bottom > window.innerHeight) note.lines[0].scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
          }
        });
      });
    });
  }

  /* 行间公式：悬停时可以复制 TeX 原文。 */
  function initMath() {
    $all("div.tex[data-tex]").forEach(function (box) {
      var button = document.createElement("button");
      button.type = "button"; button.className = "lp-copy-tex"; button.textContent = "复制 TeX";
      button.addEventListener("click", function () { copyText(box.getAttribute("data-tex"), button, "已复制"); });
      box.appendChild(button);
