  }

  function initSteppers() {
    $all(".lp-stepper").forEach(function (figure) {
      try {
        var steps = $all(".lp-steps > li", figure);
        if (!steps.length) return;
        var index = 0;
        var controls = document.createElement("div");
        controls.className = "lp-controls";
        controls.innerHTML =
          '<button type="button" class="lp-btn" data-act="prev">上一步</button>' +
          '<span class="lp-dots" role="group" aria-label="跳到某一步"></span>' +
          '<span class="lp-step-count"></span>' +
          '<button type="button" class="lp-btn is-primary" data-act="next">下一步</button>' +
          '<button type="button" class="lp-btn" data-act="play" aria-pressed="false">播放</button>';
        var dots = controls.querySelector(".lp-dots");
        steps.forEach(function (step, i) {
          var dot = document.createElement("button");
          dot.type = "button"; dot.setAttribute("data-to", String(i)); dot.setAttribute("aria-label", "第 " + (i + 1) + " 步");
          dots.appendChild(dot);
        });
        var play = controls.querySelector('[data-act="play"]'), timer = 0;
        var syncButtons = function () {
          var last = index === steps.length - 1;
          if (!timer) play.textContent = last ? "重播" : "播放";
          next.classList.toggle("is-primary", !last);
          play.classList.toggle("is-primary", last && !timer);
        };
        var stopPlay = function () {
          window.clearInterval(timer); timer = 0;
          play.setAttribute("aria-pressed", "false");
          syncButtons();
        };
        var list = figure.querySelector(".lp-steps");
        list.setAttribute("aria-live", "polite");
        list.parentNode.insertBefore(controls, list.nextSibling);
        var prev = controls.querySelector('[data-act="prev"]');
        var next = controls.querySelector('[data-act="next"]');
        var count = controls.querySelector(".lp-step-count");
        var shown = $all("[data-show]", figure).map(function (el) { return { el: el, on: parseRanges(el.getAttribute("data-show")) }; });
        var lines = $all("pre.lp-code .lp-line", figure);
        var baseOn = lines.map(function (line) { return line.classList.contains("is-on"); });
        var render = function () {
          var n = index + 1;
          steps.forEach(function (step, i) { step.classList.toggle("is-current", i === index); });
          shown.forEach(function (entry) { entry.el.classList.toggle("is-shown", !!entry.on[n]); });
          var marked = steps[index].hasAttribute("data-lines") ? parseRanges(steps[index].getAttribute("data-lines")) : null;
          lines.forEach(function (line, i) { line.classList.toggle("is-on", marked ? !!marked[parseInt(line.getAttribute("data-n"), 10)] : baseOn[i]); });
          count.textContent = n + " / " + steps.length;
          syncButtons();
          $all("button", dots).forEach(function (dot, i) {
            dot.classList.toggle("is-past", i < index);
            if (i === index) dot.setAttribute("aria-current", "step"); else dot.removeAttribute("aria-current");
          });
          var focused = document.activeElement;
          prev.disabled = index === 0;
          next.disabled = index === steps.length - 1;
          if ((focused === prev && prev.disabled) || (focused === next && next.disabled)) (prev.disabled ? next : prev).focus();
          figure.setAttribute("data-step", String(n));
          var hook = LP.onStep[figure.id];
          if (typeof hook === "function") {
            try { hook(n, figure); recovered(figure); } catch (error) { failed(figure, error); }
          }
        };
        var go = function (delta) {
          var target = Math.max(0, Math.min(steps.length - 1, index + delta));
          if (target === index) {
            if (!reduceMotion && controls.animate) {
              controls.animate([{ transform: "translateX(0)" }, { transform: "translateX(" + (delta > 0 ? 8 : -8) + "px)" }, { transform: "translateX(0)" }], { duration: 200, easing: "ease-out" });
            }
            return;
          }
          index = target; render();
        };
        controls.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          var act = button.getAttribute("data-act");
          if (act === "play") {
            if (timer) { stopPlay(); return; }
            if (index === steps.length - 1) { index = 0; render(); }
            play.textContent = "暂停"; play.setAttribute("aria-pressed", "true");
            timer = window.setInterval(function () {
              if (index >= steps.length - 1) { stopPlay(); return; }
              index += 1; render();
              if (index >= steps.length - 1) stopPlay();
            }, 2200);
            return;
          }
          if (timer) stopPlay();
          if (button.hasAttribute("data-to")) { index = parseInt(button.getAttribute("data-to"), 10); render(); }
          if (act === "prev") go(-1);
          if (act === "next") go(1);
        });
        figure.addEventListener("keydown", function (event) {
          if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
          if (event.target.matches("input, select, textarea")) return;
          if (event.key === "ArrowRight") { if (timer) stopPlay(); go(1); event.preventDefault(); }
          if (event.key === "ArrowLeft") { if (timer) stopPlay(); go(-1); event.preventDefault(); }
          if (event.key === "Home" || event.key === "End") { if (timer) stopPlay(); index = event.key === "Home" ? 0 : steps.length - 1; render(); event.preventDefault(); }
        });
        if (!figure.hasAttribute("tabindex")) figure.setAttribute("tabindex", "-1");
        render();
        figure.classList.add("is-ready");
      } catch (error) { failed(figure, error); }
    });
  }

  function readValues(figure) {
    var values = {};
    $all("input[name], select[name]", figure).forEach(function (input) {
      if (input.type === "radio") { if (input.checked) values[input.name] = input.value; return; }
      if (input.type === "checkbox") { values[input.name] = input.checked; return; }
      var number = Number(input.value);
      values[input.name] = input.value !== "" && isFinite(number) ? number : input.value;
    });
    return values;
  }

  function same(a, b) {
    if (typeof a === "number" && typeof b === "number") return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
    return String(a) === String(b);
  }

  function selfTest(figure, compute) {
    var raw = figure.getAttribute("data-cases");
    if (!raw) return;
    var cases = JSON.parse(raw);
    for (var i = 0; i < cases.length; i += 1) {
      var got = compute(cases[i]["in"]) || {};
      var want = cases[i].out || {};
      for (var key in want) {
        if (Object.prototype.hasOwnProperty.call(want, key) && !same(got[key], want[key])) {
          throw new Error("自检用例 " + (i + 1) + " 的 " + key + " 应为 " + want[key] + "，实际为 " + got[key]);
        }
      }
    }
  }

  function setInput(figure, name, value) {
    var inputs = $all('[name="' + name + '"]', figure);
    if (!inputs.length) throw new Error("预设里的 " + name + " 没有对应的控件");
    if (inputs[0].type === "radio") {
      var match = inputs.filter(function (input) { return input.value === String(value); })[0];
      if (!match) throw new Error("预设 " + name + "=" + value + " 不是可选项");
      match.checked = true;
      return;
    }
    if (inputs[0].type === "checkbox") { inputs[0].checked = !!value; return; }
    var before = inputs[0].value;
    inputs[0].value = value;
    if (String(inputs[0].value) !== String(value)) {
      inputs[0].value = before;
      throw new Error("预设 " + name + "=" + value + " 超出控件范围");
    }
  }

  function initExplorers() {
    $all(".lp-explorer").forEach(function (figure) {
      try {
        var compute = LP.explorers[figure.id];
        var outputs = $all("[data-out]", figure);
        if (typeof compute !== "function") {
          if (outputs.length) failed(figure, new Error("没有注册计算函数 " + figure.id));
          return;
        }
        try { selfTest(figure, compute); } catch (error) { failed(figure, error); return; }
        var presets = $all("[data-preset]", figure);
        var meters = outputs.filter(function (node) { return node.hasAttribute("data-bar"); }).map(function (node) {
          var meter = document.createElement("span");
          meter.className = "lp-meter"; meter.setAttribute("aria-hidden", "true");
          meter.appendChild(document.createElement("i"));
          node.insertAdjacentElement("afterend", meter);
          return { node: node, fill: meter.firstChild, max: Number(node.getAttribute("data-bar")) };
        });
        var update = function () {
          var values = readValues(figure);
          $all("[data-value-of]", figure).forEach(function (node) {
            node.textContent = LP.fmt.num(values[node.getAttribute("data-value-of")]);
          });
          var result;
          try { result = compute(values) || {}; } catch (error) {
            outputs.forEach(function (node) { node.textContent = "—"; });
            failed(figure, error);
            return;
          }
          recovered(figure);
          outputs.forEach(function (node) {
            var key = node.getAttribute("data-out");
            if (key in result) setNumber(node, result[key]); else { node.lpValue = undefined; node.textContent = "—"; }
          });
          meters.forEach(function (meter) {
            var value = result[meter.node.getAttribute("data-out")];
            var share = typeof value === "number" && isFinite(value) && meter.max > 0 ? Math.max(0, Math.min(1, value / meter.max)) : 0;
            meter.fill.style.width = (100 * share).toFixed(1) + "%";
          });
        };
        var manual = function () {
          presets.forEach(function (button) { button.setAttribute("aria-pressed", "false"); });
          update();
        };
        figure.addEventListener("input", manual);
        figure.addEventListener("change", manual);
        presets.forEach(function (button) {
          button.setAttribute("aria-pressed", "false");
          button.addEventListener("click", function () {
            try {
              var preset = JSON.parse(button.getAttribute("data-preset"));
              Object.keys(preset).forEach(function (name) { setInput(figure, name, preset[name]); });
            } catch (error) { failed(figure, error); return; }
            presets.forEach(function (other) { other.setAttribute("aria-pressed", other === button ? "true" : "false"); });
            update();
          });
        });
        update();
      } catch (error) { failed(figure, error); }
    });
  }

  /* 对照切换：按下状态的按钮组，不冒充标签页。 */
  function initToggles() {
    $all(".lp-toggle").forEach(function (figure) {
      try {
        var seg = figure.querySelector(".lp-seg");
        if (!seg) return;
        var buttons = $all("button[data-view]", seg);
        buttons.forEach(function (button) {
          $all('[data-panel="' + button.getAttribute("data-view") + '"]', figure).forEach(function (panel) {
            if (!panel.hasAttribute("data-label")) panel.setAttribute("data-label", button.textContent.trim());
          });
        });
        var thumb = document.createElement("span");
        thumb.className = "lp-seg-thumb"; thumb.setAttribute("aria-hidden", "true");
        seg.insertBefore(thumb, seg.firstChild);
        seg.setAttribute("role", "group");
        var current = buttons.filter(function (b) { return b.getAttribute("aria-selected") === "true" || b.getAttribute("aria-pressed") === "true"; })[0] || buttons[0];
        var place = function (animate) {
          if (!current.offsetWidth) return;
          if (!animate) thumb.style.transition = "none";
          thumb.style.width = current.offsetWidth + "px";
          thumb.style.transform = "translateX(" + (current.offsetLeft - 2) + "px)";
          if (!animate) { void thumb.offsetWidth; thumb.style.transition = ""; }
        };
        var show = function (button, animate) {
          current = button;
          var view = button.getAttribute("data-view");
          buttons.forEach(function (b) { b.removeAttribute("aria-selected"); b.setAttribute("aria-pressed", b === button ? "true" : "false"); });
          $all("[data-panel]", figure).forEach(function (panel) { panel.hidden = panel.getAttribute("data-panel") !== view; });
          figure.setAttribute("data-view", view);
          place(animate);
          var hook = LP.onStep[figure.id];
          if (typeof hook === "function") { try { hook(view, figure); recovered(figure); } catch (error) { failed(figure, error); } }
        };
        buttons.forEach(function (button) {
          button.addEventListener("click", function () { if (button !== current) show(button, true); });
        });
        show(current, false);
        if (window.ResizeObserver) new ResizeObserver(function () { place(false); }).observe(seg);
        else window.addEventListener("resize", function () { place(false); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { place(false); });
      } catch (error) { failed(figure, error); }
    });
  }

  function initTimers() {
    $all(".lp-timer").forEach(function (box) {
      var limit = parseInt(box.getAttribute("data-seconds") || "90", 10);
      box.innerHTML = '<button type="button" class="lp-btn">开始计时</button><span class="lp-timer-bar" aria-hidden="true"><span></span></span><span class="lp-timer-time">0 秒</span>';
      var button = box.querySelector("button"), fill = box.querySelector(".lp-timer-bar > span"), time = box.querySelector(".lp-timer-time");
      var started = 0, frame = 0;
      var stop = function (finished) {
        window.cancelAnimationFrame(frame); started = 0; button.textContent = "再来一次"; box.classList.remove("is-running");
        if (finished) announce("时间到，" + limit + " 秒");
      };
      var tick = function () {
        var seconds = Math.min(limit, (Date.now() - started) / 1000);
        fill.style.width = (100 * seconds / limit) + "%";
        time.textContent = Math.floor(seconds) + " 秒";
        box.classList.toggle("is-over", seconds >= limit);
        if (seconds < limit) frame = window.requestAnimationFrame(tick); else stop(true);
      };
      button.addEventListener("click", function () {
        if (started) { stop(false); return; }
        started = Date.now(); button.textContent = "停止"; box.classList.add("is-running"); tick();
      });
    });
  }

  /* 本地服务下提示有新版本：出错时退避重试，提示出现后停止轮询。 */
  function initLiveUpdates() {
    if (!/^https?:$/.test(window.location.protocol) || !meta) return;
    var delay = 4000, banner = null;
    var schedule = function () { window.setTimeout(poll, delay); };
    var showBanner = function () {
      if (banner) return;
      banner = document.createElement("div");
      banner.className = "lp-banner"; banner.setAttribute("role", "status");
      banner.innerHTML = '<span>页面有新内容</span><button type="button" class="lp-btn is-primary">刷新查看</button>';
      banner.querySelector("button").addEventListener("click", function () { window.location.reload(); });
      document.body.appendChild(banner);
    };
    var poll = function () {
      if (document.hidden) { schedule(); return; }
      var request = new XMLHttpRequest();
      request.open("GET", window.location.pathname + "?lp-rev", true);
      request.onload = function () {
        if (request.status === 404) return;
        var latest = null;
        try { latest = JSON.parse(request.responseText).rev; } catch (error) { return; }
        if (request.status !== 200 || typeof latest !== "number") { delay = Math.min(delay * 2, 60000); schedule(); return; }
        delay = 4000;
        if (latest > rev) { showBanner(); return; }
        schedule();
      };
      request.onerror = function () { delay = Math.min(delay * 2, 60000); schedule(); };
      request.send();
    };
    schedule();
  }

  function initScrollMemory() {
    var key = "lesson-pages-scroll:" + pageKey;
    if (!window.location.hash) {
      var saved = parseInt(store(key) || "0", 10);
      if (saved > 0) window.scrollTo({ top: saved, left: 0, behavior: "instant" });
    }
    var pending = 0;
    window.addEventListener("scroll", function () {
      window.clearTimeout(pending);
      pending = window.setTimeout(function () { store(key, String(Math.round(window.scrollY))); }, 300);
    }, { passive: true });
    /* 对话里的链接指向新块而当前页面还是旧版本时，重新加载。 */
    window.addEventListener("hashchange", function () {
      var id = idOf(window.location.hash);
      if (id && !document.getElementById(id)) {
        try { window.sessionStorage.setItem("lesson-pages-spot", "1"); } catch (error) { /* 文件页可能禁用存储 */ }
        window.location.reload();
      }
    });
  }

  /* 批注：宽屏时与所属段落顶端对齐，不压住宽图，也不互相重叠。 */
  function alignNotes() {
    var wide = window.matchMedia && window.matchMedia("(min-width: 1100px)").matches;
    var lastBottom = -Infinity;
    $all(".lp-note, ol.lp-code-notes").forEach(function (note) {
      if (note.lpLayout) { lastBottom = Math.max(lastBottom, note.lpLayout(lastBottom + 12)); return; }
      if (!note.getClientRects().length) return;
      note.style.marginTop = "";
      var anchor = note.previousElementSibling;
      if (!wide || !anchor) return;
      var natural = note.getBoundingClientRect().top;
      var floor = anchor.classList.contains("is-wide") ? anchor.getBoundingClientRect().bottom + 12 : anchor.getBoundingClientRect().top;
      var target = Math.max(floor, lastBottom + 12);
      var base = parseFloat(window.getComputedStyle(note).marginTop) || 0;
      if (target !== natural) note.style.marginTop = (base + target - natural) + "px";
      lastBottom = note.getBoundingClientRect().bottom;
    });
  }

  function initNotes() {
    alignNotes();
    var pending = 0;
    var later = function () { window.clearTimeout(pending); pending = window.setTimeout(alignNotes, 60); };
    if (window.ResizeObserver && main) new ResizeObserver(later).observe(main);
    window.addEventListener("resize", later);
    document.addEventListener("toggle", later, true);
    document.addEventListener("lp:layout", later);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignNotes);
    window.addEventListener("beforeprint", function () {
      $all(".lp-note").forEach(function (note) { note.style.marginTop = ""; });
      $all("pre.lp-code").forEach(function (pre) { pre.style.marginBottom = ""; });
    });
    window.addEventListener("afterprint", alignNotes);
  }

  /* 数字和单位、变量和取值不拆到两行。 */
  function initNoBreak() {
    if (!main) return;
    /* 行内公式后紧跟的标点不单独落到下一行行首。 */
    $all("span.tex", main).forEach(function (formula) {
      var next = formula.nextSibling;
      if (!next || next.nodeType !== 3 || !/^[，。、；：！？）」』”’,.;:!?)]/.test(next.nodeValue)) return;
      var wrap = document.createElement("span");
      wrap.className = "nb";
      formula.parentNode.insertBefore(wrap, formula);
      wrap.appendChild(formula);
      wrap.appendChild(document.createTextNode(next.nodeValue.charAt(0)));
      next.nodeValue = next.nodeValue.slice(1);
    });
    var pattern = /[A-Za-z_][A-Za-z0-9_]{0,15} ?= ?[−-]?\d[\d.,]*(?: ?(?:[KMGTP]i?B|ms|μs|ns|s|B|%))?|\d[\d.,]* (?:[KMGTP]i?B|ms|μs|ns|B|%|个|张|块|行|列|层|位|秒|分钟|字节)/g;
    var walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.parentElement || node.parentElement.closest("pre, code, script, style, .nb, svg, math, .katex, .lp-controls, .lp-where, .lp-flow, a, button, var, ruby, .lp-knob, [data-out]")) return NodeFilter.FILTER_REJECT;
        pattern.lastIndex = 0;
        return pattern.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue, fragment = document.createDocumentFragment(), last = 0;
      pattern.lastIndex = 0;
      var match;
      while ((match = pattern.exec(text))) {
        if (match.index > last) fragment.appendChild(document.createTextNode(text.slice(last, match.index)));
        var span = document.createElement("span");
        span.className = "nb"; span.textContent = match[0];
        fragment.appendChild(span);
        last = match.index + match[0].length;
      }
      if (last < text.length) fragment.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(fragment, node);
    });
  }

  /* 正文里的 var：单个字母显示成数学斜体，符号表里有的标上可查释义。部件包后来画出的内容经 ui.decorate 补上。 */
  function decorateVars(scope) {
    var names = {};
    $all("#glossary-list > div[id] > dt").forEach(function (term) {
      term.textContent.split(/[、,，]\s*/).forEach(function (name) { name = name.trim(); if (name) names[name] = true; });
    });
    $all("var", scope).forEach(function (term) {
      if (term.closest("pre, code, svg")) return;
      var text = term.textContent.trim();
      if (/^[A-Za-zα-ωΑ-Ωℓ]$/.test(text)) term.classList.add("is-math");
      if (!term.closest("#glossary") && names[text]) term.classList.add("has-gloss");
    });
  }

  /* 符号互认：指向带符号色的符号时，全页同色的符号一起亮起；符号表里有的符号显示释义。 */
  function initSymbols() {
    if (!main) return;
    var symbolOf = function (el) {
      var match = el && el.closest && el.closest(".lp-s1, .lp-s2, .lp-s3, .lp-s4");
      if (!match) return null;
      var cls = (match.getAttribute("class") || "").match(/\blp-s([1-4])\b/);
      return cls ? { el: match, n: cls[1] } : null;
    };
    var glossary = {}, byColor = {};
    $all("#glossary-list > div[id]").forEach(function (entry) {
      var term = entry.querySelector("dt"), meaning = entry.querySelector("dd");
      if (!term || !meaning) return;
      term.textContent.split(/[、,，]\s*/).forEach(function (name) { name = name.trim(); if (name && !glossary[name]) glossary[name] = entry; });
      var colored = symbolOf(term.querySelector(".lp-s1, .lp-s2, .lp-s3, .lp-s4"));
      if (colored && !byColor[colored.n]) byColor[colored.n] = entry;
    });
    var hide = function () { hidePop("symbol"); };
    var show = function (target, entry) {
      if (popFor === target && popKind === "symbol") return;
      showPop(target, "symbol", function (box) {
        var term = document.createElement("b"), text = document.createElement("span");
        term.innerHTML = entry.querySelector("dt").innerHTML;
        text.innerHTML = entry.querySelector("dd").innerHTML;
        box.appendChild(term); box.appendChild(text);
      });
    };
    var entryFor = function (el) {
      if (!el || !el.closest || el.closest("#glossary, .lp-pop, .lp-controls")) return null;
      var link = el.closest('a[href^="#"]');
      if (link) {
        var target = document.getElementById(idOf(link.getAttribute("href")));
        var entry = target && target.closest("#glossary-list > div[id]");
        return entry ? { target: link, entry: entry } : null;
      }
      var term = el.closest("var");
      if (term && !term.closest("pre") && glossary[term.textContent.trim()]) return { target: term, entry: glossary[term.textContent.trim()] };
      var symbol = el.closest("pre.lp-code, .katex") ? symbolOf(el) : null;
      if (symbol && byColor[symbol.n]) return { target: symbol.el, entry: byColor[symbol.n] };
      return null;
    };
    decorateVars(main);
    document.addEventListener("mouseover", function (event) {
      var symbol = symbolOf(event.target);
      if (symbol) root.setAttribute("data-lp-sym", symbol.n); else root.removeAttribute("data-lp-sym");
      var found = entryFor(event.target);
      if (found) show(found.target, found.entry); else if (pop && !(event.target.closest && event.target.closest(".lp-pop"))) hide();
    });
    document.addEventListener("focusin", function (event) {
      var found = entryFor(event.target);
      if (found) show(found.target, found.entry); else hide();
    });
    document.addEventListener("click", function (event) {
      var found = entryFor(event.target);
      if (found) show(found.target, found.entry);
      else if (!(event.target.closest && event.target.closest(".lp-pop"))) hide();
    });
    document.addEventListener("keydown", function (event) { if (event.key === "Escape") hidePop(); });
    window.addEventListener("scroll", hide, { passive: true });
  }

  /* 滚动出现、导师划线和检查题提示：每样只做一次；减少动态效果或不支持时全部直接显示。 */
  function initReveal() {
    var pens = $all(".lp-pen, .lp-ring"), checks = $all(".lp-check");
    if (reduceMotion || !("IntersectionObserver" in window)) {
      checks.forEach(function (check) { check.classList.add("is-in"); });
      return;
    }
    var targets = $all(".lp-main > section > :is(figure, .lp-table, blockquote, .lp-addendum, div.tex), .lp-main > .lp-check, .lp-main > section > .lp-check")
      .filter(function (el) { return !el.querySelector("ol.lp-code-notes"); });
    root.classList.add("lp-motion");
    targets.forEach(function (el) { el.classList.add("lp-reveal"); });
    var later = 0;
    var observer = new IntersectionObserver(function (records) {
      records.forEach(function (record) {
        if (!record.isIntersecting) return;
        record.target.classList.add(record.target.matches(".lp-pen, .lp-ring") ? "is-drawn" : "is-in");
        observer.unobserve(record.target);
        window.clearTimeout(later);
        later = window.setTimeout(function () { document.dispatchEvent(new CustomEvent("lp:layout")); }, 750);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0 });
    targets.concat(pens).concat(checks.filter(function (check) { return targets.indexOf(check) < 0; })).forEach(function (el) { observer.observe(el); });
    /* 焦点进了还没淡入的块（也包括链接带到的图）：立刻显出，不过渡 */
    document.addEventListener("focusin", function (event) {
      var block = event.target.closest && event.target.closest(".lp-reveal:not(.is-in)");
      if (block) { block.style.transition = "none"; block.classList.add("is-in"); observer.unobserve(block); }
    });
    window.addEventListener("beforeprint", function () {
      targets.concat(checks).forEach(function (el) { el.classList.add("is-in"); });
      pens.forEach(function (pen) { pen.classList.add("is-drawn"); });
    });
  }

  function initProgress() {
    var bar = document.createElement("div");
    bar.className = "lp-progress"; bar.setAttribute("aria-hidden", "true");
    document.body.appendChild(bar);
    var frame = 0;
    var update = function () {
      frame = 0;
      var room = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.setProperty("--p", room > 0 ? Math.min(1, Math.max(0, window.scrollY / room)).toFixed(4) : "0");
    };
    window.addEventListener("scroll", function () { if (!frame) frame = window.requestAnimationFrame(update); }, { passive: true });
    window.addEventListener("resize", update);
    update();
  }

  /* 可拖动的数字：.lp-live 段落里的 [data-knob] 可以左右拖、点按或用方向键换值，[data-out] 按注册的计算函数跟着变。
     段落挂一个“可调”标签；指向、聚焦或按住拨盘时浮出它的全部取值；第一次读到段落时，在第一个拨盘上提示一次。 */
  function initLive() {
    var boxes = $all(".lp-live");
    if (!boxes.length) return;
    document.addEventListener("pointerdown", function (event) {
      if (popKind.indexOf("knob") === 0 && !(event.target.closest && event.target.closest(".lp-knob"))) hidePop();
    }, true);
    boxes.forEach(function (box) {
      try {
        var compute = LP.explorers[box.id];
        if (typeof compute !== "function") { failed(box, new Error("没有注册计算函数 " + box.id)); return; }
        selfTest(box, compute);
        var knobs = $all("[data-knob]", box).map(function (el) {

  /* 学习地层：按内容加入页面的版本分层。右侧一根地层柱对齐每一块，图例里点一层只看这一层。 */

  /* 风格：朱批用汉字节号和题目后的印章，蓝图用标题栏里的图号与版次；讲义不加任何东西。 */

  /* 部件包：lesson_pages.py 只把页面用到的包写成 #lp-pack-* 样式与脚本；包把 { name, init } 放进

  /* 深链聚光：从对话里的链接打开页面（或已打开的页面被这样的链接带到别处）时，四周暗下来、目标亮起两秒多。

  function init() {
